name: Build Windows portable app
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: Yukino-Rail-Watch-Windows
          path: release/*.exe
          if-no-files-found: error
      - name: Publish versioned Windows release
        if: github.repository == 'Le672/yukino-rail-watch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-windows-release.ps1
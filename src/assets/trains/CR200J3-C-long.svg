<title id="title">CR200J3-C(长编) Q版动力车参考侧视图</title>
<desc id="desc">白色车身、绿色窗区与红色双曲线。圆弧驾驶端、独立侧驾驶窗、受电弓和动力车通风格栅。参考外观，具体版本待核实：图为CR200J3-C(18编组)的动力车参考外观；尚未确认本次列车的车组编号、批次、涂装细节及运行方向，不表示完整编组。</desc>
<metadata>Yukino original vector side-view reference, 2026-09-29. CC BY-SA 4.0. Physical train photo reference: https://www.china-emu.cn/Trains/Model/Detail-10112-102-S.html. Photographers: 捧一池星光. Does not reproduce source photographs or front-view avatars.</metadata>

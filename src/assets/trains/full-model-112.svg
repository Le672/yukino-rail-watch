<title id="title">CRH380A(港铁) Q版首车侧视图</title><desc id="desc">银色车身、红色驾驶窗及灯区、橙色弧线与红白波纹。CRH380A 长鼻首车；黑色侧窗带前端圆弧收口，标准港铁动感号涂装。外观核对：https://www.china-emu.cn/Trains/Model/Detail-30003-101-1.html。首车比例压缩，参考外观，非实际编组。</desc>
<metadata>Yukino original side-view drawing, revision 3, 2026-09-30. CC BY-SA 4.0. Photo reference: https://www.mtr.com.hk/archive/corporate/en/press_release/PR-16-083-C.pdf; China-EMU review: https://www.china-emu.cn/Trains/Model/Detail-30003-101-1.html. The site's front-view avatars are not reproduced.</metadata>

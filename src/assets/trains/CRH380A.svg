<title id="title">CRH380A Q版首车侧视图</title><desc id="desc">银灰鼻部、白色侧身与蓝色腰线。长鼻、上置驾驶窗、白色斜向侧边界；不将反光画成蓝色涂装。外观核对：https://www.china-emu.cn/Trains/Model/Detail-30001-101-S.html。首车比例压缩，参考外观，非实际编组。</desc>

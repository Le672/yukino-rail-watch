<title id="title">CR200J1-C Q版控制车参考侧视图</title>
<desc id="desc">白色车身、绿色窗区与红色双曲线。长斜鼻、分段侧驾驶窗、客室窗和控制端车门。参考外观，具体版本待核实：图为CR200J1-C的控制车参考外观；尚未确认本次列车的车组编号、批次、涂装细节及运行方向，不表示完整编组。</desc>
<metadata>Yukino original vector side-view reference, 2026-09-29. CC BY-SA 4.0. Physical train photo reference: https://www.china-emu.cn/Trains/Model/Detail-10101-101-S.html. Photographers: 秦浩博. Does not reproduce source photographs or front-view avatars.</metadata>

<title id="title">CR200J1-B Q版控制车参考侧视图</title>
<desc id="desc">绿色车身、深色窗区与黄色侧带。长斜鼻、分段侧驾驶窗、客室窗和控制端车门。参考外观，具体版本待核实：图为CR200J1-B的控制车参考外观；尚未确认本次列车的车组编号、批次、涂装细节及运行方向，不表示完整编组。</desc>

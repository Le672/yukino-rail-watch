<title id="title">CR200J2-A Q版动力车参考侧视图</title>
<desc id="desc">绿色车身、深色窗区与黄色侧带。圆弧驾驶端、独立侧驾驶窗、受电弓和动力车通风格栅。参考外观，具体版本待核实：图为CR200J2-A的动力车参考外观；尚未确认本次列车的车组编号、批次、涂装细节及运行方向，不表示完整编组。</desc>
